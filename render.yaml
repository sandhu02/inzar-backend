services:
  # Web API Service
  - type: web
    name: inzar-backend-api
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: "uv pip install --system ."
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: inzar/incidents
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Inzar <alerts@inzar.app>"
      - key: PUSH_PROVIDER
        value: fcm
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REVIEW_PROVIDER
        value: stub
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: SENTRY_DSN
        sync: false

  # Background Worker Service
  - type: worker
    name: inzar-backend-worker
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: "uv pip install --system ."
    startCommand: "python -m app.jobs.worker"
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SECRET_KEY
        fromService:
          type: web
          name: inzar-backend-api
          envVarKey: SECRET_KEY
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PUSH_PROVIDER
        value: fcm
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REVIEW_PROVIDER
        value: stub
      - key: SENTRY_DSN
        sync: false

